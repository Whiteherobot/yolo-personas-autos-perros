<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de personas, autos y perros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .upload-section {
            text-align: center;
            padding: 40px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .image-box {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .image-box h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .image-box img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .detections-info {
            margin-top: 30px;
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
        }

        .detection-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .detection-item .class-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #667eea;
        }

        .detection-item .confidence {
            color: #4CAF50;
            font-weight: bold;
        }

        .detection-item .bbox {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #2e7d32;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 1rem;
            opacity: 0.9;
        }
        .conf-control { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; }
        .conf-control input { flex: 1; }
        .upload-section.arrastrando { border-color: #667eea; background: #eef0ff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Detector de personas, autos y perros</h1>
            <p>YOLOv8 entrenado con Pascal VOC 2007</p>
        </header>

        <div class="main-content">
            <div class="conf-control">
                <label for="conf">Confianza mínima</label>
                <input type="range" id="conf" min="0.05" max="0.9" step="0.05" value="0.25">
                <span id="confValor">0.25</span>
            </div>

            <div class="upload-section" id="zona">
                <h2 style="margin-bottom: 15px;">Subir imagen</h2>
                <p style="margin-bottom: 20px;">Arrastre una imagen aquí o haga clic para elegirla</p>
                <input type="file" id="fileInput" accept="image/*">
                <button class="upload-btn" type="button">Elegir imagen</button>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: #667eea; font-weight: bold;">Procesando imagen...</p>
            </div>

            <div id="error" class="error hidden"></div>

            <div id="results" class="hidden">
                <div class="stats">
                    <div class="stat-card"><div class="number" id="total">0</div><div class="label">Detecciones</div></div>
                    <div class="stat-card"><div class="number" id="cuenta-person">0</div><div class="label">Personas</div></div>
                    <div class="stat-card"><div class="number" id="cuenta-car">0</div><div class="label">Autos</div></div>
                    <div class="stat-card"><div class="number" id="cuenta-dog">0</div><div class="label">Perros</div></div>
                </div>

                <div class="preview-container">
                    <div class="image-box"><h3>Original</h3><img id="original" alt="Imagen original"></div>
                    <div class="image-box"><h3>Detecciones</h3><img id="anotada" alt="Imagen con las detecciones"></div>
                </div>

                <div class="detections-info">
                    <h3 style="margin-bottom: 20px;">Detalle</h3>
                    <div id="lista"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const NOMBRES = { person: "Persona", car: "Auto", dog: "Perro" };
        const $ = (id) => document.getElementById(id);
        let archivo = null;

        $("conf").addEventListener("input", () => { $("confValor").textContent = $("conf").value; });
        $("conf").addEventListener("change", () => archivo && predecir());
        $("zona").addEventListener("click", () => $("fileInput").click());
        $("fileInput").addEventListener("change", (e) => elegir(e.target.files[0]));
        $("zona").addEventListener("dragover", (e) => { e.preventDefault(); $("zona").classList.add("arrastrando"); });
        $("zona").addEventListener("dragleave", () => $("zona").classList.remove("arrastrando"));
        $("zona").addEventListener("drop", (e) => {
            e.preventDefault();
            $("zona").classList.remove("arrastrando");
            elegir(e.dataTransfer.files[0]);
        });

        function elegir(f) {
            if (!f) return;
            archivo = f;
            $("original").src = URL.createObjectURL(f);
            predecir();
        }

        async function predecir() {
            $("error").classList.add("hidden");
            $("loading").style.display = "block";
            const datos = new FormData();
            datos.append("image", archivo);
            datos.append("conf", $("conf").value);
            try {
                const r = await fetch("/predict", { method: "POST", body: datos });
                const res = await r.json();
                if (!r.ok) throw new Error(res.error || "Error en la predicción");
                mostrar(res);
            } catch (error) {
                $("error").textContent = error.message;
                $("error").classList.remove("hidden");
            } finally {
                $("loading").style.display = "none";
            }
        }

        function mostrar(res) {
            $("results").classList.remove("hidden");
            $("anotada").src = res.imagen_anotada;
            $("total").textContent = res.detecciones.length;
            for (const clase of Object.keys(NOMBRES)) $(`cuenta-${clase}`).textContent = res.conteo[clase] ?? 0;
            const lista = $("lista");
            lista.replaceChildren();
            if (!res.detecciones.length) {
                lista.textContent = "No se detectó nada con esa confianza.";
                return;
            }
            res.detecciones.forEach((d, i) => {
                const fila = document.createElement("div");
                fila.className = "detection-item";
                const [x1, y1, x2, y2] = d.caja;
                fila.textContent = `${i + 1}. ${NOMBRES[d.clase] ?? d.clase}: ${(d.confianza * 100).toFixed(1)} %, caja (${x1}, ${y1}) a (${x2}, ${y2})`;
                lista.append(fila);
            });
        }
    </script>
</body>
</html>
